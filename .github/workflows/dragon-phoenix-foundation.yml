name: Dragon Phoenix foundation integrity
on:
  push:
    paths:
      - 'soul_land_2_dragon_phoenix/**'
      - '.github/workflows/dragon-phoenix-foundation.yml'
  pull_request:
    paths:
      - 'soul_land_2_dragon_phoenix/**'
      - '.github/workflows/dragon-phoenix-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dragon-phoenix-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Integrity, adversarial tests, expected readiness refusal
        run: bash soul_land_2_dragon_phoenix/checks/run_all.sh
