function show(id){
 document.querySelectorAll('.navlist button').forEach(b=>b.classList.toggle('on',b.dataset.go===id));
 const p=panels.find(x=>x[0]===id)||panels[0];
 document.getElementById('ttl').textContent=p[1];
 const host=document.getElementById('root');host.innerHTML='';
 host.appendChild(el(V2[id]?V2[id]():'<p class="empty">no data</p>'));
 location.hash=id;applySearch();
}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)show(b.dataset.go)});
const term=()=>document.getElementById('q').value.trim();
function strip(node,re){
 node.querySelectorAll('mark').forEach(m=>m.replaceWith(m.textContent));
 if(!re)return 0;let hits=0;
 const w=document.createTreeWalker(node,NodeFilter.SHOW_TEXT),tn=[];
 while(w.nextNode()){const n=w.currentNode;if(n.nodeValue.trim())tn.push(n)}
 tn.forEach(n=>{const v=n.nodeValue;if(!re.test(v))return;re.lastIndex=0;
  const f=document.createDocumentFragment();let last=0,m;
  while((m=re.exec(v))){if(m.index>last)f.append(v.slice(last,m.index));
   const mk=document.createElement('mark');mk.textContent=m[0];f.append(mk);last=m.index+m[0].length}
  if(last<v.length)f.append(v.slice(last));n.replaceWith(f);hits++});
 return hits;
}
function applySearch(){
 const t=term(),host=document.getElementById('root');
 const re=t.length>1?new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'):null;
 const hits=strip(host,re),b0=document.getElementById('hcnt');
 if(t.length>1){if(!b0){const b=el(`<span class="tag ${hits?'pass':'fail'}" id="hcnt">${hits} match${hits===1?'':'es'}</span>`);
   document.getElementById('ttl').after(b)}else b0.textContent=`${hits} match${hits===1?'':'es'}`}
 else if(b0)b0.remove();
}
document.getElementById('q').addEventListener('input',applySearch);
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.id!=='q'){e.preventDefault();
 document.getElementById('q').focus()}if(e.key==='Escape'){document.getElementById('q').value='';applySearch()}});
if(typeof globalThis!=='undefined')globalThis.__V=V2;
show((location.hash||'#overview').slice(1));
</script>
